# Nginx vhost for the Laravel "micro-blog" application.
# Nginx and PHP-FPM run inside the same container:
#   - Nginx listens on :80 and serves static files from ./public
#   - PHP requests are forwarded to PHP-FPM on 127.0.0.1:9000

server {
    listen 80;
    server_name micro-blog.localhost;

    root /var/www/public;

    index index.php;

    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Protect hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Laravel front controller for pretty routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Route PHP requests to the FPM worker pool
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~*\.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}