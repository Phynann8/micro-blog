services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: micro-blog:latest
    restart: unless-stopped
    ports:
      - "8000:80"
    environment: &app_env
      APP_NAME: "Micro Blog"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      # Database (points at the `db` service in this compose file)
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: micro_blog_db
      DB_USERNAME: root
      DB_PASSWORD: password
      # Runtime drivers (all persisted to MySQL, so no extra services needed)
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      # Logging / mail in production
      LOG_CHANNEL: stack
      LOG_LEVEL: info
      MAIL_MAILER: log
      FILESYSTEM_DISK: public
    volumes:
      - storage-data:/var/www/storage/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: micro_blog_db
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - db-data:/var/lib/mysql
    ports:
      # Exposed only for debugging from outside Docker
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db-data:
  storage-data: